<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bai2.3</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            img {
                width: 80px;
                height: 80px;
            }
            .khung{
                border: 2px solid black;
                min-height: 100px;
                padding: 10px;
            }
        </style>
    </head>

    <body>
        <main class="container mt-4">
            <h3>Bài 2.3: Căn chỉnh hình ảnh theo mẫu</h3>
            <p>Left alingment (This is default)</p>
            <div class="khung">
                <img src="anh-dep-83.jpg" alt="Ảnh">
            </div>
            <p class="mt-3">Center alingment using text alignment classes</p>
            <div class="khung text-center">
                <img src="anh-dep-83.jpg" alt="Ảnh">
            </div>
            <p class="mt-3">Right alignment using text alignment classes</p>
            <div class="khung text-end">
                <img src="anh-dep-83.jpg" alt="Ảnh">
            </div>
            <!--4-->
            <p class="mt-3">Horizontl alignment using float class</p>
            <div class="khung">
                <img src="anh-dep-83.jpg" class="float-start" alt="Ảnh">
                <img src="anh-dep-83.jpg" class="float-end" alt="Ảnh">
            </div>
            <!--5-->
            <p class="mt-3">Center alignment of block-level image using auto margin</p>
            <div class="khung">
                <img src="anh-dep-83.jpg"
                class="d-block mx-auto"
                alt="Ảnh">
            </div>


        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
