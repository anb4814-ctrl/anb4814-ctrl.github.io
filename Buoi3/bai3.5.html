<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bài 3.5</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container py-5">

    <h2>Bài 3.5</h2>

    <!-- ================= PHẦN A ================= -->

    <h3 class="mt-4">a) Xác thực biểu mẫu</h3>

    <form class="was-validated">

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">
                Tên người dùng:
            </label>

            <input type="text"
                   class="form-control"
                   placeholder="Nhập tên người dùng"
                   required>

            <div class="invalid-feedback">
                Vui lòng nhập tên người dùng.
            </div>
        </div>


        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">
                Mật khẩu:
            </label>

            <input type="password"
                   class="form-control"
                   placeholder="Nhập mật khẩu"
                   required>

            <div class="invalid-feedback">
                Vui lòng nhập mật khẩu.
            </div>
        </div>


        <!-- Checkbox -->
        <div class="form-check mb-3">

            <input class="form-check-input"
                   type="checkbox"
                   required>

            <label class="form-check-label">
                Tôi đồng ý
            </label>

            <div class="invalid-feedback">
                Bạn phải đồng ý.
            </div>

        </div>


        <button class="btn btn-primary">
            Đăng nhập
        </button>

    </form>


    <!-- ================= PHẦN B ================= -->

    <hr class="my-5">

    <h3>b) Registration Form</h3>

    <form>

        <!-- First Name -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                First Name:
            </label>

            <div class="col-md-9">
                <input type="text"
                       class="form-control"
                       placeholder="First Name">
            </div>
        </div>


        <!-- Last Name -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                Last Name:
            </label>

            <div class="col-md-9">
                <input type="text"
                       class="form-control"
                       placeholder="Last Name">
            </div>
        </div>


        <!-- Email -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                Email Address:
            </label>

            <div class="col-md-9">
                <input type="email"
                       class="form-control"
                       placeholder="Email Address">
            </div>
        </div>


        <!-- Mobile -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                Mobile Number:
            </label>

            <div class="col-md-9">
                <input type="text"
                       class="form-control"
                       placeholder="Mobile Number">
            </div>
        </div>


        <!-- Date of Birth -->
        <div class="row mb-3">

            <label class="col-md-3 col-form-label">
                Date of Birth:
            </label>

            <div class="col-md-3">
                <select class="form-select">
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
            </div>

            <div class="col-md-3">
                <select class="form-select">
                    <option>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                </select>
            </div>

            <div class="col-md-3">
                <select class="form-select">
                    <option>Year</option>
                    <option>2000</option>
                    <option>2001</option>
                    <option>2002</option>
                </select>
            </div>

        </div>


        <!-- Address -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                Postal Address:
            </label>

            <div class="col-md-9">
                <textarea class="form-control"
                          rows="3"
                          placeholder="Postal Address"></textarea>
            </div>
        </div>


        <!-- Zip Code -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                Zip Code:
            </label>

            <div class="col-md-9">
                <input type="text"
                       class="form-control"
                       placeholder="Zip Code">
            </div>
        </div>


        <!-- Upload Image -->
        <div class="row mb-3">
            <label class="col-md-3 col-form-label">
                Upload Image:
            </label>

            <div class="col-md-9">
                <input type="file"
                       class="form-control">
            </div>
        </div>


        <!-- Gender -->
        <div class="row mb-3">

            <label class="col-md-3 col-form-label">
                Gender:
            </label>

            <div class="col-md-9">

                <div class="form-check form-check-inline">

                    <input class="form-check-input"
                           type="radio"
                           name="gender">

                    <label class="form-check-label">
                        Male
                    </label>

                </div>

                <div class="form-check form-check-inline">

                    <input class="form-check-input"
                           type="radio"
                           name="gender">

                    <label class="form-check-label">
                        Female
                    </label>

                </div>

            </div>

        </div>


        <!-- Terms -->
        <div class="form-check mb-3">

            <input class="form-check-input"
                   type="checkbox">

            <label class="form-check-label">
                I agree to the Terms and Conditions
            </label>

        </div>


        <!-- Buttons -->
        <button type="submit"
                class="btn btn-primary">
            Submit
        </button>

        <button type="reset"
                class="btn btn-secondary">
            Reset
        </button>

    </form>

</body>
</html>
