<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài 3.1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">

    <!-- a) Các loại Button -->
    <h2>a) Định nghĩa các class buttons</h2>

    <button class="btn btn-light">Default Button</button>
    <button class="btn btn-primary">Primary Button</button>
    <button class="btn btn-success">Success Button</button>
    <button class="btn btn-info">Info Button</button>
    <button class="btn btn-warning">Warning Button</button>
    <button class="btn btn-danger">Danger Button</button>
    <button class="btn btn-link">Link Button</button>

    <hr>

    <!-- b) Button có đường viền -->
    <h2>b) Button với đường viền</h2>

    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-outline-secondary">Secondary</button>
    <button class="btn btn-outline-success">Success</button>
    <button class="btn btn-outline-info">Info</button>
    <button class="btn btn-outline-warning">Warning</button>
    <button class="btn btn-outline-danger">Danger</button>
    <button class="btn btn-outline-dark">Dark</button>
    <button class="btn btn-outline-light text-dark">Light</button>

    <hr>

    <!-- c) Kích thước Button -->
    <h2>c) Kích thước của button</h2>

    <button class="btn btn-primary btn-lg">Nút to</button>
    <button class="btn btn-primary">Kích thước mặc định</button>
    <button class="btn btn-primary btn-sm">Nút nhỏ</button>

    <hr>

    <!-- d) Thành phần Button -->
    <h2>d) Thành phần của Button</h2>

    <a href="#" class="btn btn-primary">Button chứa link</a>
    <button class="btn btn-primary">Button</button>
    <input type="button" class="btn btn-primary" value="Input Button">
    <input type="submit" class="btn btn-primary" value="Submit Button">

    <hr>

    <!-- e) Trạng thái Button -->
    <h2>e) Trạng thái của nút</h2>

    <button class="btn btn-primary">Nút bình thường</button>
    <button class="btn btn-primary">Nút có thể click</button>
    <button class="btn btn-primary" disabled>Nút không thể click</button>
    <a href="#" class="btn btn-primary disabled">Link không thể click</a>

    <hr>

    <!-- f) Button Loading -->
    <h2>f) Nút đang load</h2>

    <button class="btn btn-primary">
        <span class="spinner-border spinner-border-sm"></span>
    </button>

    <button class="btn btn-primary">
        <span class="spinner-border spinner-border-sm"></span>
        Loading...
    </button>

    <button class="btn btn-primary" disabled>
        <span class="spinner-border spinner-border-sm"></span>
        Loading..
    </button>
    <button class="btn btn-primary" disabled>
        <span class="spinner-grow spinner-grow-sm"></span>
        Loading..
    </button>

</body>
</html>
